<!DOCTYPE html>
<html lang="zh-Hant" data-theme="pgr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>角色立繪高解析度檢視器｜亞雷利塔 ARELITA 戰術終端</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="shortcut icon" href="assets/favicon.svg" />
  <script>
    (function () {
      try {
        localStorage.setItem("arelita_theme", "pgr");
        document.documentElement.setAttribute("data-theme", "pgr");
        const pal = localStorage.getItem("arelita_pgr_palette") || "blue";
        document.documentElement.setAttribute("data-pgr-palette", pal);
      } catch (e) {}
    })();
  </script>
  <style>
    :root,
    body.bg-dark,
    body.bg-checker {
      --bg-canvas: #090a0d;
      --bg-toolbar: rgba(11, 13, 18, 0.96);
      --border-color: rgba(224, 26, 34, 0.55);
      --border-subtle: rgba(255, 255, 255, 0.14);
      --text-primary: #f4f6fa;
      --text-secondary: #98a2b3;
      --accent-crimson: #e01a22;
      --accent-crimson-soft: rgba(224, 26, 34, 0.16);
      --btn-bg: #13161f;
    }

    body.bg-light {
      --bg-canvas: #e5e7eb;
      --bg-toolbar: rgba(15, 18, 24, 0.96);
      --border-color: rgba(224, 26, 34, 0.6);
      --border-subtle: rgba(255, 255, 255, 0.16);
      --text-primary: #f4f6fa;
      --text-secondary: #98a2b3;
      --accent-crimson: #e01a22;
      --accent-crimson-soft: rgba(224, 26, 34, 0.18);
      --btn-bg: #181c26;
    }

    html[data-pgr-palette="blue"],
    html[data-pgr-palette="blue"] body.bg-dark,
    html[data-pgr-palette="blue"] body.bg-checker {
      --border-color: rgba(0, 210, 255, 0.55);
      --accent-crimson: #00f0ff;
      --accent-crimson-soft: rgba(0, 240, 255, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", -apple-system, sans-serif;
      user-select: none;
    }

    /* Canvas Background Modes (PGR Tactical Terminal) */
    body.bg-dark {
      background-color: #090a0d;
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
        radial-gradient(circle at 72% 28%, rgba(224, 26, 34, 0.12), transparent 52%),
        radial-gradient(circle at 50% 50%, #12151e 0%, #07080b 88%);
      background-size: 24px 24px, 100% 100%, 100% 100%;
    }
    body.bg-light {
      background: radial-gradient(circle at 50% 45%, #f8fafc 0%, #cbd5e1 88%);
    }
    body.bg-checker {
      background-color: #0e1017;
      background-image:
        linear-gradient(45deg, #171b26 25%, transparent 25%),
        linear-gradient(-45deg, #171b26 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #171b26 75%),
        linear-gradient(-45deg, transparent 75%, #171b26 75%);
      background-size: 28px 28px;
      background-position: 0 0, 0 14px, 14px -14px, -14px 0;
    }

    /* Top Floating Tactical Control Bar */
    .viewer-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: var(--bg-toolbar);
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      z-index: 100;
      gap: 1rem;
      flex-wrap: nowrap;
    }

    .viewer-header::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 240px;
      height: 2px;
      background: linear-gradient(90deg, #e01a22, transparent);
    }

    .viewer-title-box {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .viewer-badge {
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: #ffffff;
      background: #e01a22;
      padding: 0.22rem 0.65rem;
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
      flex-shrink: 0;
      white-space: nowrap;
    }

    .viewer-title {
      font-size: 1.02rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .viewer-controls {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .ctrl-btn {
      background: var(--btn-bg);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
      padding: 0.38rem 0.72rem;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.28rem;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ctrl-btn:hover,
    .ctrl-btn.active {
      border-color: var(--accent-crimson);
      color: #ffffff;
      background: rgba(224, 26, 34, 0.24);
      box-shadow: 0 0 12px rgba(224, 26, 34, 0.35);
    }

    .zoom-readout {
      min-width: 64px;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      color: #ff4d55;
      background: rgba(224, 26, 34, 0.14);
      border: 1px solid rgba(224, 26, 34, 0.55);
      padding: 0.34rem 0.5rem;
      flex-shrink: 0;
    }

    .ctrl-divider {
      width: 1px;
      height: 22px;
      background: var(--border-subtle);
      margin: 0 0.25rem;
    }

    /* Interactive Viewport */
    .viewport {
      position: fixed;
      top: 64px;
      left: 0;
      right: 0;
      bottom: 28px;
      overflow: hidden;
      cursor: grab;
    }

    .viewport.dragging {
      cursor: grabbing;
    }

    .stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    #portraitImage {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      max-width: none;
      max-height: none;
      transform-origin: 0 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Bottom Floating Help Pill */
    .viewer-footer-hint {
      position: fixed;
      bottom: 2.4rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 13, 18, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-left: 3px solid #e01a22;
      padding: 0.42rem 1.25rem;
      font-size: 0.76rem;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 1.1rem;
      z-index: 90;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
    }

    .viewer-footer-hint strong {
      color: #ff4d55;
    }

    /* PGR Bottom Tactical HUD Bar */
    .pgr-viewer-bottom-hud {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 28px;
      background: rgba(9, 10, 13, 0.96);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      color: rgba(255, 255, 255, 0.42);
      z-index: 100;
      pointer-events: none;
    }
    .pgr-viewer-bottom-hud .caution {
      color: #e01a22;
    }
  </style>
</head>
<body class="bg-dark">
  <header class="viewer-header">
    <div class="viewer-title-box">
      <span class="viewer-badge">CHARACTER ILLUSTRATION // 立繪細節檢視</span>
      <h1 class="viewer-title" id="charTitle">角色立繪檢視</h1>
    </div>

    <div class="viewer-controls">
      <button class="ctrl-btn" id="btnZoomOut" title="縮小 (滾輪向下)">➖ 縮小</button>
      <div class="zoom-readout" id="zoomLevelText">100%</div>
      <button class="ctrl-btn" id="btnZoomIn" title="放大 (滾輪向上)">➕ 放大</button>
      <button class="ctrl-btn" id="btnZoomFit" title="自動適應視窗高度">🗖 適應視窗</button>
      <button class="ctrl-btn" id="btnZoomChar" title="聚焦角色全身最佳比例">🎯 聚焦角色</button>
      <button class="ctrl-btn" id="btnZoomActual" title="100% 原始 4K 解析度像素">1:1 原圖像素</button>

      <div class="ctrl-divider"></div>

      <button class="ctrl-btn active" data-bg="bg-dark" title="戰雙黑曜網格底">🌑 戰術黑底</button>
      <button class="ctrl-btn" data-bg="bg-checker" title="透明棋盤格背景">🏁 網格底</button>
      <button class="ctrl-btn" data-bg="bg-light" title="純白背景">☀️ 淺色底</button>

      <div class="ctrl-divider"></div>

      <a class="ctrl-btn" id="rawImgLink" href="#" target="_blank" title="直接開啟原始 PNG 圖檔">🖼️ 原始圖檔</a>
      <a class="ctrl-btn" href="index.html" title="返回亞雷利塔主檔案庫">🏛️ 主檔案庫</a>
    </div>
  </header>

  <main class="viewport" id="viewport">
    <div class="stage" id="stage">
      <img id="portraitImage" src="" alt="角色高解析度立繪" />
    </div>
  </main>

  <div class="viewer-footer-hint">
    <span>🖱️ <strong>滾輪上下</strong>：自由無段縮放細節（15% ～ 600%）</span>
    <span>✋ <strong>左鍵按住拖曳</strong>：自由移動畫面位置</span>
    <span>🖱️ <strong>雙擊畫面</strong>：快速放大／還原</span>
  </div>

  <footer class="pgr-viewer-bottom-hud" aria-hidden="true">
    <span>▶ ▶ ▶ ARELITA FORCE // CHARACTER ILLUSTRATION TERMINAL</span>
    <span class="caution">▽ CAUTION // HIGH-RESOLUTION OPTICAL FEED</span>
    <span>SYS.VER // ARL-36-HD //////////////// ◢</span>
  </footer>

  <script>
    (function () {
      "use strict";

      const params = new URLSearchParams(window.location.search);
      const src = params.get("src") || "";
      const caption = params.get("caption") || "角色立繪檢視";

      const titleEl = document.getElementById("charTitle");
      const imgEl = document.getElementById("portraitImage");
      const rawLink = document.getElementById("rawImgLink");
      const viewport = document.getElementById("viewport");
      const zoomText = document.getElementById("zoomLevelText");

      titleEl.textContent = caption;
      titleEl.title = caption;
      document.title = caption + "｜立繪細節檢視器 - 亞雷利塔 ARELITA";

      if (!src) {
        titleEl.textContent = "未指定立繪路徑";
        return;
      }

      imgEl.addEventListener("load", () => {
        focusCharacter();
      });

      imgEl.src = src;
      rawLink.href = src;
      if (imgEl.complete && imgEl.naturalWidth > 0) {
        focusCharacter();
      }

      let scale = 1;
      let posX = 0;
      let posY = 0;
      let isDragging = false;
      let startX = 0;
      let startY = 0;

      const MIN_SCALE = 0.15;
      const MAX_SCALE = 6.0;

      function updateTransform() {
        imgEl.style.transform = `translate3d(${posX}px, ${posY}px, 0) scale(${scale})`;
        imgEl.style.transformOrigin = "0 0";
        zoomText.textContent = `${Math.round(scale * 100)}%`;
      }

      // Fit full image inside viewport
      function fitToViewport() {
        const vw = viewport.clientWidth;
        const vh = viewport.clientHeight;
        const iw = imgEl.naturalWidth || 1920;
        const ih = imgEl.naturalHeight || 1080;

        scale = Math.min((vw * 0.92) / iw, (vh * 0.92) / ih);
        posX = (vw - iw * scale) / 2;
        posY = (vh - ih * scale) / 2;
        updateTransform();
      }

      // Focus nicely on the character height (fills ~92% of viewport height)
      function focusCharacter() {
        const vw = viewport.clientWidth;
        const vh = viewport.clientHeight;
        const iw = imgEl.naturalWidth || 3840;
        const ih = imgEl.naturalHeight || 2160;

        // If 16:9 4K canvas, character occupies ~82% of height in center
        scale = (vh * 0.94) / ih;
        posX = (vw - iw * scale) / 2;
        posY = (vh - ih * scale) / 2;
        updateTransform();
      }

      // 1:1 100% original pixel zoom centered on character
      function zoomActual1to1() {
        const vw = viewport.clientWidth;
        const vh = viewport.clientHeight;
        const iw = imgEl.naturalWidth || 3840;
        const ih = imgEl.naturalHeight || 2160;

        scale = 1;
        posX = (vw - iw) / 2;
        posY = Math.min(20, (vh - ih) / 3);
        updateTransform();
      }

      function zoomAtPoint(newScale, clientX, clientY) {
        const rect = viewport.getBoundingClientRect();
        const mx = clientX - rect.left;
        const my = clientY - rect.top;

        const clamped = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
        const ratio = clamped / scale;

        posX = mx - (mx - posX) * ratio;
        posY = my - (my - posY) * ratio;
        scale = clamped;
        updateTransform();
      }

      // Mouse wheel zoom around cursor position
      viewport.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const factor = e.deltaY < 0 ? 1.16 : 1 / 1.16;
          zoomAtPoint(scale * factor, e.clientX, e.clientY);
        },
        { passive: false }
      );

      // Drag to pan
      viewport.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        isDragging = true;
        startX = e.clientX - posX;
        startY = e.clientY - posY;
        viewport.classList.add("dragging");
      });

      window.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        posX = e.clientX - startX;
        posY = e.clientY - startY;
        updateTransform();
      });

      window.addEventListener("mouseup", () => {
        isDragging = false;
        viewport.classList.remove("dragging");
      });

      // Double click to toggle zoom in / reset
      viewport.addEventListener("dblclick", (e) => {
        const ih = imgEl.naturalHeight || 2160;
        const baseScale = (viewport.clientHeight * 0.94) / ih;
        if (scale < baseScale * 1.6) {
          zoomAtPoint(baseScale * 2.2, e.clientX, e.clientY);
        } else {
          focusCharacter();
        }
      });

      // Toolbar Buttons
      document.getElementById("btnZoomIn").addEventListener("click", () => {
        const rect = viewport.getBoundingClientRect();
        zoomAtPoint(scale * 1.25, rect.left + rect.width / 2, rect.top + rect.height / 2);
      });

      document.getElementById("btnZoomOut").addEventListener("click", () => {
        const rect = viewport.getBoundingClientRect();
        zoomAtPoint(scale / 1.25, rect.left + rect.width / 2, rect.top + rect.height / 2);
      });

      document.getElementById("btnZoomFit").addEventListener("click", fitToViewport);
      document.getElementById("btnZoomChar").addEventListener("click", focusCharacter);
      document.getElementById("btnZoomActual").addEventListener("click", zoomActual1to1);

      document.querySelectorAll("[data-bg]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("[data-bg]").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          document.body.className = btn.getAttribute("data-bg");
        });
      });

      window.addEventListener("resize", () => {
        updateTransform();
      });
    })();
  </script>
</body>
</html>
