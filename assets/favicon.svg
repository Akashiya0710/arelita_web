<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2a145c"/>
      <stop offset="60%" stop-color="#120829"/>
      <stop offset="100%" stop-color="#070312"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#e5b8ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#e4b858"/>
    </linearGradient>
  </defs>
  <!-- Outer Shield / Rounded Badge -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bg)" stroke="url(#gold)" stroke-width="2.5"/>
  <!-- Subtle Astrolabe Orbit Ring -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#gold)" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.7"/>
  <!-- Rotated Diamond Frame -->
  <polygon points="32,9 55,32 32,55 9,32" fill="rgba(192,132,252,0.12)" stroke="url(#gold)" stroke-width="1.8"/>
  <!-- Four-Pointed Radiant Star -->
  <path d="M32 6 L37.5 26.5 L58 32 L37.5 37.5 L32 58 L26.5 37.5 L6 32 L26.5 26.5 Z" fill="url(#star)"/>
  <!-- Inner Core Gem -->
  <polygon points="32,23 41,32 32,41 23,32" fill="#14092e" stroke="#fde68a" stroke-width="1.6"/>
  <circle cx="32" cy="32" r="3.6" fill="#fef08a"/>
</svg>
