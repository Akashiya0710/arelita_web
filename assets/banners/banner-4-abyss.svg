    <polygon points="0,155 134,-78 -134,-78" fill="none" stroke="#f43f5e" stroke-width="1.1" opacity="0.5"/>
  </g>

  <!-- Jagged Obsidian Demon Realm Peaks & Gothic Citadel -->
