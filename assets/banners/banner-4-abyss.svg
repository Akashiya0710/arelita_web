  </defs>

  <rect width="1600" height="640" fill="url(#abyssSky)"/>
  <rect width="1600" height="640" fill="url(#bloodMoon)"/>

  <!-- Giant Eclipse Blood Moon & Abyssal Sigil -->
  <g transform="translate(800, 215)">
