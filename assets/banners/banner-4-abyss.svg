<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="abyssSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0310"/>
      <stop offset="50%" stop-color="#220824"/>
      <stop offset="85%" stop-color="#3b0a26"/>
      <stop offset="100%" stop-color="#0d030c"/>
    </linearGradient>
    <radialGradient id="bloodMoon" cx="50%" cy="34%" r="45%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#9333ea" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0b0310" stop-opacity="0"/>
