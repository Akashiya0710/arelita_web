<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="scifiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030816"/>
      <stop offset="50%" stop-color="#081a38"/>
      <stop offset="100%" stop-color="#041022"/>
    </linearGradient>
    <radialGradient id="coreReactor" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#030816" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyberGrid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- Deep Space & Reactor Core Glow -->
  <rect width="1600" height="640" fill="url(#scifiBg)"/>
  <rect width="1600" height="640" fill="url(#coreReactor)"/>

  <!-- Futuristic Orbital Ring & Quantum HUD Geometry -->
  <g transform="translate(800, 270)" opacity="0.55">
    <ellipse rx="560" ry="165" fill="none" stroke="#22d3ee" stroke-width="2" transform="rotate(-11)"/>
    <ellipse rx="520" ry="145" fill="none" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="16 10" transform="rotate(-11)"/>
    <circle r="190" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6"/>
    <circle r="135" fill="none" stroke="#a5f3fc" stroke-width="1.2"/>
    <polygon points="0,-115 100,58 -100,58" fill="none" stroke="#22d3ee" stroke-width="1"/>
  </g>

  <!-- Sci-Fi Perspective Horizon Grid -->
  <g stroke="url(#cyberGrid)" stroke-width="1.2">
    <line x1="800" y1="360" x2="0" y2="640"/>
    <line x1="800" y1="360" x2="260" y2="640"/>
    <line x1="800" y1="360" x2="520" y2="640"/>
    <line x1="800" y1="360" x2="800" y2="640"/>
    <line x1="800" y1="360" x2="1080" y2="640"/>
    <line x1="800" y1="360" x2="1340" y2="640"/>
    <line x1="800" y1="360" x2="1600" y2="640"/>
    <line x1="0" y1="440" x2="1600" y2="440" opacity="0.25"/>
    <line x1="0" y1="495" x2="1600" y2="495" opacity="0.35"/>
    <line x1="0" y1="560" x2="1600" y2="560" opacity="0.5"/>
  </g>

  <!-- Megastructure Quantum Citadels (Left & Right) -->
  <g fill="#061329" stroke="#22d3ee" stroke-width="1.2">
    <polygon points="110,640 140,210 215,165 250,640"/>
    <polygon points="270,640 290,280 355,245 375,640"/>
    <polygon points="1225,640 1245,245 1310,280 1330,640"/>
    <polygon points="1350,640 1385,165 1460,210 1490,640"/>
  </g>

  <!-- Starships Cruising in Formation -->
  <g transform="translate(460, 175)">
    <polygon points="0,12 95,0 68,24 15,24" fill="#0e294b" stroke="#67e8f9" stroke-width="1.5"/>
    <ellipse cx="8" cy="14" rx="18" ry="4" fill="#22d3ee"/>
  </g>
  <g transform="translate(1060, 140) scale(-1, 1)">
    <polygon points="0,12 115,0 82,28 18,28" fill="#0e294b" stroke="#67e8f9" stroke-width="1.5"/>
    <ellipse cx="8" cy="15" rx="22" ry="5" fill="#22d3ee"/>
  </g>

  <!-- Central Quantum Conduit Beam -->
  <rect x="794" y="0" width="12" height="440" fill="#a5f3fc" opacity="0.75"/>
  <rect x="780" y="0" width="40" height="440" fill="#22d3ee" opacity="0.22"/>
  <circle cx="800" cy="270" r="32" fill="#ecfeff" opacity="0.9"/>
</svg>
