<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="celestialBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0720"/>
      <stop offset="45%" stop-color="#1e1548"/>
      <stop offset="82%" stop-color="#31246b"/>
      <stop offset="100%" stop-color="#120c2b"/>
    </linearGradient>
    <radialGradient id="sanctumGold" cx="50%" cy="35%" r="52%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.72"/>
      <stop offset="42%" stop-color="#c084fc" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#0b0720" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="640" fill="url(#celestialBg)"/>
  <rect width="1600" height="640" fill="url(#sanctumGold)"/>

  <!-- Grand Astral Clockwork & Constellation Rings -->
  <g transform="translate(800, 230)" opacity="0.58">
    <circle r="270" fill="none" stroke="#fde047" stroke-width="1.5" stroke-dasharray="12 8"/>
    <circle r="215" fill="none" stroke="#e9d5ff" stroke-width="1.2"/>
    <circle r="155" fill="none" stroke="#fde047" stroke-width="1" stroke-dasharray="4 6"/>
    <line x1="-340" y1="0" x2="340" y2="0" stroke="#fde047" stroke-width="0.9" opacity="0.6"/>
    <line x1="0" y1="-290" x2="0" y2="290" stroke="#fde047" stroke-width="0.9" opacity="0.6"/>
  </g>

  <!-- Floating Celestial Pantheon Pillars & Stairway of Light -->
  <g fill="#1b133d" stroke="#fde047" stroke-width="1.3">
    <rect x="330" y="210" width="42" height="260" rx="4"/>
    <rect x="440" y="165" width="46" height="305" rx="4"/>
    <rect x="1114" y="165" width="46" height="305" rx="4"/>
    <rect x="1228" y="210" width="42" height="260" rx="4"/>
    <!-- Central Pantheon Sanctuary -->
    <polygon points="650,470 680,190 800,115 920,190 950,470"/>
  </g>

  <!-- Golden Stairway of Light -->
  <polygon points="720,470 880,470 1040,640 560,640" fill="#fde047" opacity="0.28"/>
  <line x1="700" y1="500" x2="900" y2="500" stroke="#fef08a" stroke-width="2"/>
  <line x1="665" y1="540" x2="935" y2="540" stroke="#fef08a" stroke-width="2"/>
  <line x1="625" y1="585" x2="975" y2="585" stroke="#fef08a" stroke-width="2"/>

  <!-- Starlight Motes -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="220" cy="130" r="3"/><circle cx="540" cy="110" r="3.5"/><circle cx="800" cy="70" r="5"/>
    <circle cx="1060" cy="110" r="3.5"/><circle cx="1380" cy="130" r="3"/>
  </g>
</svg>
