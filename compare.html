<!DOCTYPE html>
<html lang="zh-Hant" data-theme="ocean">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>角色能力對比系統｜亞雷利塔 ARELITA 官方檔案庫</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="shortcut icon" href="assets/favicon.svg" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("arelita_theme");
        var valid = ["ocean", "beach", "worldtree", "starry", "dark", "light"];
        var theme = valid.indexOf(saved) !== -1 ? saved : "ocean";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body class="is-loaded compare-page-body">
  <!-- Decorative Game-Portal Background Grid & Ambient Orbs -->
  <div class="bg-grid-overlay" aria-hidden="true"></div>
  <div class="bg-graphic-layer" aria-hidden="true">
    <div class="bg-orb bg-orb-gold"></div>
    <div class="bg-orb bg-orb-blue"></div>
    <!-- Sunny Holiday Beach Layer (Active in Beach Theme) -->
    <div class="beach-layer">
      <div class="beach-sun-wrap">
        <div class="beach-sun-corona"></div>
        <div class="beach-sun-rays"></div>
        <div class="beach-sun-core"></div>
      </div>
      <svg class="beach-sky-svg" viewBox="0 0 1440 420" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="1060" cy="145" rx="340" ry="72" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.5" fill="none" />
        <ellipse cx="1060" cy="145" rx="235" ry="48" stroke="rgba(186, 242, 255, 0.45)" stroke-width="1.2" stroke-dasharray="8 6" fill="none" />
        <ellipse cx="380" cy="110" rx="260" ry="52" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.2" fill="none" />
        <path fill="rgba(255, 255, 255, 0.42)" d="M920,320 C920,285 950,260 985,265 C1000,230 1045,215 1080,235 C1110,210 1160,225 1175,260 C1210,260 1235,285 1235,320 Z" />
        <path fill="rgba(255, 255, 255, 0.32)" d="M140,290 C140,265 165,245 195,250 C210,222 250,215 278,235 C305,225 335,245 340,275 C365,278 380,295 380,315 L140,315 Z" />
      </svg>
      <svg class="beach-waves-svg" viewBox="0 0 1440 320" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path class="beach-wave wave-deep" fill="rgba(28, 165, 201, 0.24)" d="M0,192L60,181.3C120,171,240,149,360,154.7C480,160,600,192,720,197.3C840,203,960,181,1080,165.3C1200,149,1320,139,1380,133.3L1440,128L1440,320L1380,320C1320,320,1200,320,1080,320C960,320,840,320,720,320C600,320,480,320,360,320C240,320,120,320,60,320L0,320Z"></path>
        <path class="beach-wave wave-aqua" fill="rgba(92, 224, 212, 0.32)" d="M0,224L80,213.3C160,203,320,181,480,186.7C640,192,800,224,960,224C1120,224,1280,192,1360,176L1440,160L1440,320L1360,320C1280,320,1120,320,960,320C800,320,640,320,480,320C320,320,160,320,80,320L0,320Z"></path>
        <path class="beach-wave wave-foam" fill="rgba(255, 255, 255, 0.52)" d="M0,250L60,246C120,242,240,234,360,238C480,242,600,260,720,260C840,260,960,242,1080,233C1200,224,1320,224,1380,224L1440,224L1440,320L1380,320C1320,320,1200,320,1080,320C960,320,840,320,720,320C600,320,480,320,360,320C240,320,120,320,60,320L0,320Z"></path>
      </svg>
      <div class="beach-shore-sand"></div>
      <span class="beach-sparkle sp-1"></span>
      <span class="beach-sparkle sp-2"></span>
      <span class="beach-sparkle sp-3"></span>
      <span class="beach-sparkle sp-4"></span>
      <span class="beach-sparkle sp-5"></span>
      <span class="beach-sparkle sp-6"></span>
      <span class="beach-sparkle sp-7"></span>
    </div>
    <div class="bg-watermark-text">ARELITA // VERSUS</div>
  </div>

  <!-- Fixed Header for Ability Comparison Page -->
  <header class="site-header compare-site-header" id="compareHeader">
    <div class="header-inner">
      <a href="index.html" class="brand" title="返回亞雷利塔主檔案庫">
        <div class="brand-emblem">
          <span class="emblem-diamond">⚔️</span>
        </div>
        <div class="brand-text">
          <div class="brand-title">
            <span>亞雷利塔・角色能力對比</span>
            <span class="brand-sub-en">TACTICAL ABILITY COMPARATOR</span>
          </div>
          <div class="brand-subtitle">左右雙視窗角色基礎資料與全能力對照</div>
        </div>
      </a>

      <div class="compare-header-controls">
        <button type="button" class="compare-action-btn" id="btnSwapChars" title="左右視窗角色互換">
          <span>⇄</span>
          <span>左右互換</span>
        </button>
        <button type="button" class="compare-action-btn compare-clear-both-btn" id="btnClearBothChars" title="一次清除左右兩邊已選取的角色">
          <span>🗑️</span>
          <span>清除兩邊角色</span>
        </button>
        <div class="compare-random-group" role="group" aria-label="隨機對決模式">
          <button type="button" class="compare-action-btn random-group-btn" id="btnRandomPure" title="完全隨機抽選兩名角色進行對決">
            <span>🎲</span>
            <span>純粹隨機</span>
          </button>
          <button type="button" class="compare-action-btn random-group-btn random-balanced-btn" id="btnRandomSimilar" title="隨機抽選兩名實力相近的角色（嚴格相差不超過 2 個小階級，如神王一可對決古神二，但不跨超過 2 階）">
            <span>⚖️</span>
            <span>實力相近隨機</span>
          </button>
        </div>
        <button type="button" class="compare-action-btn" id="btnToggleAllPickers" title="同時展開或收合左右角色的篩選器">
          <span>🔍</span>
          <span id="togglePickersLabel">展開雙邊選角器</span>
        </button>
        <button type="button" class="compare-action-btn" id="btnCopyCompareUrl" title="複製當前雙角色對比網址">
          <span>🔗</span>
          <span id="copyUrlText">分享對比連結</span>
        </button>
        <button type="button" id="compareThemeToggleBtn" class="theme-toggle-btn" title="切換網頁主題風格">
          <span class="theme-icon" id="compareThemeIcon">🌊</span>
          <span class="theme-text" id="compareThemeText">夏日海洋</span>
        </button>
        <a href="index.html" class="compare-action-btn primary-back-btn" title="返回亞雷利塔主頁面">
          <span>🏛️</span>
          <span>返回主檔案庫</span>
        </a>
      </div>
    </div>
  </header>

  <main class="compare-main-container">
    <!-- Left & Right Split Windows -->
    <section class="compare-dual-grid" aria-label="左右角色能力對比視窗">
      <!-- ==================== LEFT WINDOW (CHARACTER A) ==================== -->
      <div class="compare-window-pane pane-left" id="comparePaneLeft">
        <div class="compare-pane-topbar">
          <div class="pane-slot-badge slot-left">
            <span class="slot-dot"></span>
            <span>左側視窗（角色 A）</span>
          </div>
          <div class="pane-topbar-actions">
            <button type="button" class="pane-btn-toggle-picker" id="btnTogglePickerLeft">
              <span>🔍 篩選／更換角色</span>
            </button>
            <button type="button" class="pane-btn-clear" id="btnClearLeft" title="清空左側角色">✕ 清空</button>
          </div>
        </div>

        <!-- Compact Multi-Dimensional Filter & Character Picker (Left) -->
        <div class="compare-picker-drawer" id="pickerDrawerLeft">
          <div class="picker-filter-toolbar">
            <div class="search-input-wrap picker-search-box">
              <span class="search-icon">⌕</span>
              <input type="search" id="searchLeft" placeholder="搜尋角色名稱、稱號、武器或能力關鍵字..." autocomplete="off" />
            </div>
            <div class="picker-toolbar-meta">
              <span class="picker-match-count" id="matchCountLeft">175 名</span>
              <button type="button" class="picker-reset-btn" id="btnResetFiltersLeft">↺ 重置篩選</button>
            </div>
          </div>

          <div class="picker-filter-compact-grid">
            <select id="realmLeft" class="picker-select" aria-label="所屬界域"></select>
            <select id="factionLeft" class="picker-select" aria-label="主陣營勢力"></select>
            <select id="subFactionLeft" class="picker-select" aria-label="子陣營或部隊"></select>
            <select id="powerLeft" class="picker-select" aria-label="強度階級"></select>
            <select id="raceLeft" class="picker-select" aria-label="種族分類"></select>
            <select id="alignLeft" class="picker-select" aria-label="善惡傾向"></select>
            <select id="attrCatLeft" class="picker-select" aria-label="屬性大類"></select>
            <select id="attrItemLeft" class="picker-select" aria-label="單一屬性"></select>
            <select id="abilityTypeLeft" class="picker-select" aria-label="持有能力體系"></select>
          </div>

          <!-- Filtered Character Roster Multi-Column Grid (Left) -->
          <div class="picker-roster-scroll" id="rosterListLeft"></div>
        </div>

        <!-- Selected Character Combat Dossier Display (Left) -->
        <div class="compare-dossier-body" id="dossierBodyLeft"></div>
      </div>

      <!-- ==================== RIGHT WINDOW (CHARACTER B) ==================== -->
      <div class="compare-window-pane pane-right" id="comparePaneRight">
        <div class="compare-pane-topbar">
          <div class="pane-slot-badge slot-right">
            <span class="slot-dot"></span>
            <span>右側視窗（角色 B）</span>
          </div>
          <div class="pane-topbar-actions">
            <button type="button" class="pane-btn-toggle-picker" id="btnTogglePickerRight">
              <span>🔍 篩選／更換角色</span>
            </button>
            <button type="button" class="pane-btn-clear" id="btnClearRight" title="清空右側角色">✕ 清空</button>
          </div>
        </div>

        <!-- Compact Multi-Dimensional Filter & Character Picker (Right) -->
        <div class="compare-picker-drawer" id="pickerDrawerRight">
          <div class="picker-filter-toolbar">
            <div class="search-input-wrap picker-search-box">
              <span class="search-icon">⌕</span>
              <input type="search" id="searchRight" placeholder="搜尋角色名稱、稱號、武器或能力關鍵字..." autocomplete="off" />
            </div>
            <div class="picker-toolbar-meta">
              <span class="picker-match-count" id="matchCountRight">175 名</span>
              <button type="button" class="picker-reset-btn" id="btnResetFiltersRight">↺ 重置篩選</button>
            </div>
          </div>

          <div class="picker-filter-compact-grid">
            <select id="realmRight" class="picker-select" aria-label="所屬界域"></select>
            <select id="factionRight" class="picker-select" aria-label="主陣營勢力"></select>
            <select id="subFactionRight" class="picker-select" aria-label="子陣營或部隊"></select>
            <select id="powerRight" class="picker-select" aria-label="強度階級"></select>
            <select id="raceRight" class="picker-select" aria-label="種族分類"></select>
            <select id="alignRight" class="picker-select" aria-label="善惡傾向"></select>
            <select id="attrCatRight" class="picker-select" aria-label="屬性大類"></select>
            <select id="attrItemRight" class="picker-select" aria-label="單一屬性"></select>
            <select id="abilityTypeRight" class="picker-select" aria-label="持有能力體系"></select>
          </div>

          <!-- Filtered Character Roster Multi-Column Grid (Right) -->
          <div class="picker-roster-scroll" id="rosterListRight"></div>
        </div>

        <!-- Selected Character Combat Dossier Display (Right) -->
        <div class="compare-dossier-body" id="dossierBodyRight"></div>
      </div>
    </section>
  </main>

  <!-- Floating Back-to-Top Button -->
  <button id="backToTopBtn" class="back-to-top-btn" title="回到網頁最頂部" aria-label="回到網頁最頂部">
    <span class="btt-arrow">▲</span>
    <span class="btt-label">TOP</span>
  </button>

  <script src="assets/data.js"></script>
  <script src="assets/compare.js"></script>
</body>
</html>
